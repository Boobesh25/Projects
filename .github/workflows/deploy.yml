name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches:
      - main
      - career-radar
      - jobradar
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # 1. CI: Fast Unit & Endpoint Tests
  # ---------------------------------------------------------------------------
  test:
    name: Run Unit & Health Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx beautifulsoup4 google-auth
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: "."
          JWT_SECRET: "ci-test-secret-key-12345-enterprise-minimum-32-chars"
          DEFAULT_USER_EMAIL: "boobesh2509@gmail.com"
          DATABASE_URL: "sqlite+aiosqlite:///data/career_portal.db"
        run: |
          pytest tests/ -v

  # ---------------------------------------------------------------------------
  # 2. Build & Push Multi-Stage Docker Images to GHCR (API & UI)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push Backend API Image
      - name: Extract Docker Metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/jobradar-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and Push Frontend UI Image
      - name: Extract Docker Metadata (UI)
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/jobradar-ui
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push UI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ui
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. CD: Automated Deployment to Remote Server via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/career-radar' || github.ref == 'refs/heads/jobradar'
    steps:
      - name: Connect and Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            API_IMAGE="ghcr.io/${REPO_LOWER}/jobradar-api:latest"
            UI_IMAGE="ghcr.io/${REPO_LOWER}/jobradar-ui:latest"

            echo "==== 1. Log in to GitHub Container Registry ===="
            LOGIN_OK=false
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
                if echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "$ACTOR_LOWER" --password-stdin; then
                    echo "Authenticated to GHCR via GHCR_TOKEN"
                    LOGIN_OK=true
                fi
            fi
            if [ "$LOGIN_OK" = false ]; then
                echo "GHCR_TOKEN not accepted or expired. Trying GITHUB_TOKEN..."
                if echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$ACTOR_LOWER" --password-stdin; then
                    echo "Authenticated to GHCR via GITHUB_TOKEN"
                    LOGIN_OK=true
                else
                    echo "Notice: Direct GHCR login failed. Proceeding (images may be public or cached)..."
                fi
            fi

            echo "==== 2. Setup Dedicated Application Directory on Server ===="
            APP_DIR="${{ secrets.SERVER_APP_DIR }}/../jobradar"
            mkdir -p "$APP_DIR" 2>/dev/null || APP_DIR="$HOME/jobradar"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            mkdir -p data
            echo "Deployment directory: $(pwd)"

            # Auto-copy .env from parent or SERVER_APP_DIR if present
            if [ -f "${{ secrets.SERVER_APP_DIR }}/.env" ] && [ ! -f ".env" ]; then
                cp "${{ secrets.SERVER_APP_DIR }}/.env" .env || true
            fi

            # Auto-detect whether server uses 'docker compose' (v2 plugin) or 'docker-compose' (v1/v2 standalone)
            if docker compose version >/dev/null 2>&1; then
                DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
                DC="docker-compose"
            else
                echo "Neither 'docker compose' nor 'docker-compose' was found on the server!"
                exit 1
            fi
            echo "Using Compose command: $DC"

            # Generate production docker-compose.yml for JobRadar
            cat << 'EOF' > docker-compose.yml
version: '3.8'

services:
  api:
    image: ghcr.io/boobesh25/projects/jobradar-api:latest
    container_name: jobradar_api
    restart: always
    ports:
      - "8001:8000"
    environment:
      - PORT_API=8000
      - DEFAULT_USER_EMAIL=boobesh2509@gmail.com
      - DATABASE_URL=sqlite+aiosqlite:////app/data/career_portal.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  ui:
    image: ghcr.io/boobesh25/projects/jobradar-ui:latest
    container_name: jobradar_ui
    restart: always
    ports:
      - "8501:8501"
    environment:
      - PORT_UI=8501
      - API_BASE_URL=http://api:8000
      - DEFAULT_USER_EMAIL=boobesh2509@gmail.com
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: jobradar_tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      api:
        condition: service_healthy
EOF

            echo "==== 3. Pull Latest Images from GHCR ===="
            docker pull "$API_IMAGE" || true
            docker pull "$UI_IMAGE" || true

            echo "==== 4. Restart Application Services with Zero Downtime ===="
            $DC up -d --remove-orphans

            echo "==== 5. Resilient Health Check Verification ===="
            API_OK=false
            for i in $(seq 1 25); do
                if curl -sf http://127.0.0.1:8001/api/health || curl -sf http://127.0.0.1:8000/api/health; then
                    echo "API is healthy!"
                    API_OK=true
                    break
                fi
                echo "Waiting for API service to initialize (attempt $i/25)..."
                sleep 3
            done
            if [ "$API_OK" = false ]; then
                echo "API Health check timed out!"
                docker logs jobradar_api || true
                exit 1
            fi

            UI_OK=false
            for i in $(seq 1 25); do
                if curl -sf http://127.0.0.1:8501/_stcore/health; then
                    echo "UI is healthy!"
                    UI_OK=true
                    break
                fi
                echo "Waiting for UI service to initialize (attempt $i/25)..."
                sleep 3
            done
            if [ "$UI_OK" = false ]; then
                echo "UI Health check timed out!"
                docker logs jobradar_ui || true
                exit 1
            fi

            echo "==== 6. Retrieve Cloudflare Tunnel URL ===="
            sleep 6
            TUNNEL_URL=$(docker logs jobradar_tunnel 2>&1 | grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' | head -n 1 || true)
            echo "=========================================================="
            echo "CLOUDFLARE TUNNEL URL: $TUNNEL_URL"
            echo "Use this URL as API_BASE_URL in Streamlit Cloud Secrets"
            echo "=========================================================="

            echo "==== 7. Prune Dangling Images ===="
            docker image prune -f || true
            echo "Deployment successful!"
