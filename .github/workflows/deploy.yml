name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches:
      - main
      - career-radar
      - jobradar
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # 1. CI: Fast Unit & Endpoint Tests
  # ---------------------------------------------------------------------------
  test:
    name: Run Unit & Health Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx beautifulsoup4 google-auth
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: "."
          JWT_SECRET: "ci-test-secret-key-12345-enterprise-minimum-32-chars"
          DEFAULT_USER_EMAIL: "boobesh2509@gmail.com"
          DATABASE_URL: "sqlite+aiosqlite:///data/career_portal.db"
        run: |
          pytest tests/ -v

  # ---------------------------------------------------------------------------
  # 2. Build & Push Multi-Stage Docker Images to GHCR (API & UI)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push Backend API Image
      - name: Extract Docker Metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/jobradar-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and Push Frontend UI Image
      - name: Extract Docker Metadata (UI)
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/jobradar-ui
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push UI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ui
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. CD: Automated Deployment to Remote Server via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/career-radar' || github.ref == 'refs/heads/jobradar'
    steps:
      - name: Connect and Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            API_IMAGE="ghcr.io/${REPO_LOWER}/jobradar-api:latest"
            UI_IMAGE="ghcr.io/${REPO_LOWER}/jobradar-ui:latest"

            echo "==== 1. Log in to GitHub Container Registry ===="
            LOGIN_OK=false

            # Try GITHUB_TOKEN first (automatically generated with packages:write permissions for this run)
            echo "Authenticating to GHCR with GITHUB_TOKEN..."
            if echo "${{ github.token }}" | docker login ghcr.io -u "$ACTOR_LOWER" --password-stdin; then
                echo "Successfully authenticated to GHCR via GITHUB_TOKEN"
                LOGIN_OK=true
            else
                echo "Notice: GITHUB_TOKEN direct login was not accepted."
            fi

            # Fallback to GHCR_TOKEN repository secret if GITHUB_TOKEN failed
            if [ "$LOGIN_OK" = false ] && [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
                echo "Authenticating to GHCR with GHCR_TOKEN secret..."
                if echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "$ACTOR_LOWER" --password-stdin; then
                    echo "Successfully authenticated to GHCR via GHCR_TOKEN"
                    LOGIN_OK=true
                else
                    echo "Notice: GHCR_TOKEN login failed. Check that token is Classic (ghp_...) with read:packages."
                fi
            fi

            if [ "$LOGIN_OK" = false ]; then
                echo "Notice: Proceeding with pull (if package visibility is set to Public, pull succeeds without login)."
            fi

            echo "==== 2. Setup Dedicated Application Directory on Server ===="
            APP_DIR="$HOME/jobradar"
            mkdir -p "$APP_DIR/data"
            cd "$APP_DIR"
            echo "Deployment directory: $(pwd)"

            # Auto-copy .env if present
            if [ -n "${{ secrets.SERVER_APP_DIR }}" ] && [ -f "${{ secrets.SERVER_APP_DIR }}/.env" ] && [ ! -f ".env" ]; then
                cp "${{ secrets.SERVER_APP_DIR }}/.env" .env || true
            fi
            touch .env || true

            echo "==== 2.1 Free Disk Space on Server ===="
            echo "Disk space before cleanup:"
            df -h /

            # Stop and remove old JobRadar containers to release snapshot locks
            docker stop jobradar_api jobradar_ui 2>/dev/null || true
            docker rm jobradar_api jobradar_ui 2>/dev/null || true

            # Prune dangling/unused images and build caches (does not affect active running containers like postgres/redis)
            docker builder prune -af 2>/dev/null || true
            docker image prune -af 2>/dev/null || true
            docker system prune -f 2>/dev/null || true

            # Vacuum old logs if present
            truncate -s 0 /var/lib/docker/containers/*/*-json.log 2>/dev/null || true

            echo "Disk space after cleanup:"
            df -h /

            echo "==== 3. Pull Latest JobRadar API Image ===="
            PULLED_API=false
            for attempt in 1 2 3; do
                if docker pull "$API_IMAGE"; then
                    PULLED_API=true
                    break
                fi
                echo "API pull failed on attempt $attempt, waiting 3s..."
                sleep 3
            done

            if [ "$PULLED_API" = false ]; then
                echo "Error: Failed to pull $API_IMAGE from GHCR."
                echo "If GHCR denied access, please refresh secrets.GHCR_TOKEN or make package public on GitHub."
                exit 1
            fi
            docker tag "$API_IMAGE" jobradar_api:latest || true

            echo "==== 4. Restart JobRadar API Container on Host Port 8001 ===="
            docker run -d \
              --name jobradar_api \
              --restart always \
              -p 8001:8000 \
              --env-file .env \
              -e PORT_API=8000 \
              -e DEFAULT_USER_EMAIL=boobesh2509@gmail.com \
              -e DATABASE_URL="sqlite+aiosqlite:////app/data/career_portal.db" \
              -v "$APP_DIR/data:/app/data" \
              "$API_IMAGE"

            echo "==== 5. Pull & Restart JobRadar UI Container on Host Port 8501 ===="
            FREE_MB=$(df -m / | awk 'NR==2 {print $4}')
            echo "Available disk space: ${FREE_MB}MB"
            if [ "$FREE_MB" -gt 1500 ]; then
                if docker pull "$UI_IMAGE"; then
                    docker tag "$UI_IMAGE" jobradar_ui:latest || true
                    docker run -d \
                      --name jobradar_ui \
                      --restart always \
                      -p 8501:8501 \
                      --env-file .env \
                      -e PORT_UI=8501 \
                      -e API_BASE_URL="http://127.0.0.1:8001" \
                      -e DEFAULT_USER_EMAIL=boobesh2509@gmail.com \
                      "$UI_IMAGE" || true
                fi
            else
                echo "Notice: Disk space is tight (${FREE_MB}MB). Skipped container jobradar_ui to preserve disk for API."
            fi

            echo "==== 6. Verify Health on Host Port 8001 ===="
            API_OK=false
            for i in $(seq 1 20); do
                if curl -sf http://127.0.0.1:8001/api/health; then
                    echo "API is healthy on http://127.0.0.1:8001/api/health!"
                    API_OK=true
                    break
                fi
                echo "Waiting for API service to initialize (attempt $i/20)..."
                sleep 2
            done

            if [ "$API_OK" = false ]; then
                echo "API Health check timed out on port 8001!"
                docker logs jobradar_api --tail 50 || true
                exit 1
            fi

            echo "==== 7. Prune Dangling Images ===="
            docker image prune -f || true
            echo "Deployment to server successful!"
