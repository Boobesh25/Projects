name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. CI: Fast Unit Tests & Code Linting
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Unit & Health Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: "."
          JWT_SECRET: "ci-test-secret-key-12345"
          GEMINI_API_KEY: "dummy-test-key"
          DATABASE_URL: "postgresql+asyncpg://postgres:pass@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379"
        run: |
          pytest tests/ -v

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Build & Push Multi-Stage Docker Image to GHCR
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # 3. CD: Automated Deployment to Remote Server via SSH
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect and Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "==== 1. Log in to GitHub Container Registry ===="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "==== 2. Navigate to Project Directory ===="
            cd ${{ secrets.SERVER_APP_DIR }}

            echo "==== 3. Pull Latest Docker Image ===="
            docker compose -f docker-compose.api.yml pull api || docker compose -f docker-compose.server.yml pull api

            echo "==== 4. Restart API Container with Zero Downtime ===="
            docker compose -f docker-compose.api.yml up -d --no-deps api || docker compose -f docker-compose.server.yml up -d --no-deps api

            echo "==== 5. Health Check Verification ===="
            sleep 10
            curl -f http://127.0.0.1:8000/health || (echo "Health check failed!" && exit 1)

            echo "==== 6. Prune Dangling Images ===="
            docker image prune -f
            echo "✅ Deployment successful!"
